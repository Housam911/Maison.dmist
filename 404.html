* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px;
  background: radial-gradient(120% 80% at 50% 0%, var(--warm), var(--cream) 60%); color: var(--deep);

html[lang="ar"] h1 { font-family: "Amiri", serif; line-height: 1.4; }
.rule { width: 64px; height: 1px; margin: 22px auto; background: var(--sage); }
.line { margin: 0 auto 28px; max-width: 36ch; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 999px; text-decoration: none; font-weight: 500; font-size: 15px;
  border: 1px solid var(--olive); color: var(--olive); transition: transform .25s, background .25s, color .25s; }
.btn--fill { background: var(--olive); color: var(--cream); }
.btn:hover { transform: translateY(-2px); }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn svg.stroke { fill: none; stroke: currentColor; stroke-width: 1.8; }
.others { margin-top: 40px; color: var(--muted); font-size: 15px; }
.others a { color: var(--olive); text-decoration: none; margin-inline: 6px; }
footer { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center; font-size: 13px; color: var(--muted); }
.version { padding: 2px 11px; border: 1px solid currentColor; border-radius: 999px; color: var(--deep); font-weight: 500; }
:focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
